name: PR Sample Video Artifact

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-sample-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install opencv-python-headless

      - name: Generate sample video
        run: |
          python -m studio.tools.generate_sample_video \
            --output artifacts/sample_prototype_pr.mp4 \
            --seconds 2 \
            --fps 24 \
            --width 640 \
            --height 360

      - name: Upload sample video artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-prototype-video
          path: artifacts/sample_prototype_pr.mp4
          if-no-files-found: error
